<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO Meta Tags  -->
    <title>Pricing Comparison Table</title>
    <meta name="description" content="The goal of this project is to teach you how to display structured data in HTML using a real, accessible table.">
    
</head>
<body>
    <header>
        <h1>Acme Plans</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <table border="1">
            <caption>Plan Comparison</caption>
            <thead>
                <th>Plan</th>
                <th>Storage</th>
                <th>Projects</th>
                <th>Support</th>
            </thead>
            <tbody>
                <tr>
                    <td>Free</td>
                    <td>5 GB</td>
                    <td>3</td>
                    <td>Email</td>
                </tr>

                <tr>
                    <td>Pro</td>
                    <td>100 GB</td>
                    <td>25</td>
                    <td>Priority Email</td>
                </tr>

                <tr>
                    <td>Business</td>
                    <td>1 TB</td>
                    <td>Unlimited</td>
                    <td>24/7 Phone</td>
                </tr>
            </tbody>

            <tfoot>
                <tr>
                    <td colspan="4">All Plans include SSL and daily backups</td>
                </tr>
            </tfoot>
        </table>
    </main>

    <footer>
        <p>&copy; 2025 All rights reserved</p>
    </footer>
</body>
</html>
