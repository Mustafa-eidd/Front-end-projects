<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags -->
    <title>Contact Form</title>
    <meta
    name="description"

    content="Build an accessible HTML contact form with real labels,
     grouped controls, and browser validation."
    >
</head>
<body>
    <header>
        <h1>Acme Support</h1>
        
        <nav>
            <a href="#">Home</a>
            <a href="#">Help</a>
            <a href="#">Contact</a>
        </nav>
        <hr>
    </header>

    <main>
        <section class="form">
            <h2>Contact us</h2>
            <p>Send us a message and we will get back to you.</p>

            <form action="" method="post">
                <label for="full-name">Full name</label>
                <input type="text" name="name" id="full-name" required>
                
                <br><br>
                
                <label for="email">Email</label>
                <input type="email" name="email" id="email" required>

                <br><br>

                <label for="subject">Subject</label>
                <select name="subject" id="subject" >
                    <option value="HTML">HTML</option>
                    <option value="CSS">CSS</option>
                    <option value="JavaScript">JavaScript</option>
                </select>

                <br><br>

                <label for="message">Message</label>
                <textarea name="message" id="message" required minlength="20"></textarea>

                <br><br>

                <fieldset>
                    <legend>How did you hear about us?</legend>
                    <input type="radio" id="search">
                    <label for="search">Search</label>
                    <br>
                    <input type="radio" id="friend">
                    <label for="friend">Friend</label>
                    <br>
                    <input type="radio" id="social">
                    <label for="social">Social Media</label>
                    <br><br>
                    <input type="checkbox" id="send">
                    <label for="send">Send me product update</label>
                </fieldset>
                <br>
                <input type="submit" value="Send message">
                <hr>
            </form>
        </section>
    </main>

    <footer>
        &copy; 2026 Acme Support
    </footer>
</body>
</html>
