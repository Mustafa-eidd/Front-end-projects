<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Photo Showcase</title>
</head>

<body>

    <!-- Page Header -->
    <header>
        <h1>Photo Showcase</h1>

        <p>
            A small collection of beautiful photographs and an embedded video.
        </p>
    </header>


    <!-- Main Content -->
    <main>

        <!-- Photo Collection -->
        <section>
            <h2>My Favorite Photos</h2>

            <!-- Photo 1 -->
            <figure>
                <img
                    src="https://picsum.photos/id/1015/600/400"
                    alt="Mountain landscape with a river flowing through the valley"
                    width="600"
                    height="400"
                >

                <figcaption>
                    A peaceful mountain landscape with a flowing river.
                </figcaption>
            </figure>


            <!-- Photo 2 -->
            <figure>
                <img
                    src="https://picsum.photos/id/1016/600/400"
                    alt="Large mountain covered with trees under a cloudy sky"
                    width="600"
                    height="400"
                >

                <figcaption>
                    A mountain surrounded by trees and clouds.
                </figcaption>
            </figure>


            <!-- Photo 3 -->
            <figure>
                <img
                    src="https://picsum.photos/id/1025/600/400"
                    alt="Golden retriever sitting outdoors and looking toward the camera"
                    width="600"
                    height="400"
                >

                <figcaption>
                    A friendly dog enjoying the outdoors.
                </figcaption>
            </figure>


            <!-- Photo 4 -->
            <img
                src="https://picsum.photos/id/1024/600/400"
                alt="Brown dog standing outdoors in a natural environment"
                width="600"
                height="400"
            >


            <!-- Photo 5 -->
            <img
                src="https://picsum.photos/id/1035/600/400"
                alt="Wooden bridge crossing a river surrounded by green trees"
                width="600"
                height="400"
            >


            <!-- Photo 6 -->
            <img
                src="https://picsum.photos/id/1043/600/400"
                alt="Forest path surrounded by tall green trees"
                width="600"
                height="400"
            >

        </section>


        <!-- Decorative Image -->
        <section>
            <h2>Decorative Image</h2>

            <img
                src="https://picsum.photos/id/106/600/150"
                alt=""
                width="600"
                height="150"
            >
        </section>


        <!-- Video Section -->
        <section>
            <h2>Featured Video</h2>

            <p>
                Watch this short video showcasing a beautiful natural scene.
            </p>

            <video
                controls
                width="600"
                height="400"
                poster="https://picsum.photos/id/1015/600/400"
            >
                <source
                    src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
                    type="video/mp4"
                >

                Your browser does not support the video element.
                Please use a modern browser to watch this video.
            </video>
        </section>

    </main>


    <!-- Page Footer -->
    <footer>
        <p>
            &copy; 2026 Photo Showcase. All rights reserved.
        </p>
    </footer>

</body>
</html>
