<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags  -->
    <title>Photo Showcase</title>
    <meta name="description" 
    content="Build an HTML photo showcase page with proper alt text, 
    figures with captions, and an embedded video."
    >
</head>
<body>
    <header>
        <h1>Images Page</h1>
    </header>

    <main>
        <figure>
            <img src="media/images.png" alt="image web design" width="500" height="300">
            <figcaption>Web Design</figcaption>
        </figure>
        <figure>
            <img src="media/images (1).jfif" alt="UI/UX Design" width="500" height="300">
            <figcaption>UI/UX Design</figcaption>
        </figure>
        <figure>
            <img src="media/images (2).jfif" alt="Web Design" width="500" height="300">
            <figcaption>Study Web Design</figcaption>
        </figure>
        <figure>
            <img src="media/images (3).jfif" alt="Digital marketing solution" width="500" height="300">
            <figcaption>Digital marketing solution</figcaption>
        </figure>
        <figure>
            <img src="media/images.jfif" alt="What is website" width="500" height="300">
            <figcaption>What is website</figcaption>
        </figure>
        <figure>
            <video src="media/video_2026-08-23_18-14-57.mp4" controls width="500" height="300" poster="media/images (4).jfif"></video>
        </figure>
    </main>
    <footer>
        <p>
            &copy; 2026 Photo Showcase. All rights reserved.
        </p>
    </footer>    
</body>
</html>
